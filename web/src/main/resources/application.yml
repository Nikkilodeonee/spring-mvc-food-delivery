spring:
  application:
    name: food-delivery
  profiles:
    default: local
  jpa:
    open-in-view: false

info:
  app:
    name: Food Delivery API
    description: Multi-module Spring Boot food ordering service
    java-version: '17'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
